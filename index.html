<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ericade Store - Global Game & APK Platform</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #090d16 0%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.95);
      --accent-color: #10b981;
      --cyan-glow: #38bdf8;
      --gold-color: #f59e0b;
      --danger-color: #ef4444;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    header h1 {
      color: var(--accent-color);
      font-size: 2.3rem;
      font-weight: 900;
      text-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
      letter-spacing: 1px;
    }

    header p {
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .container {
      max-width: 520px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      margin-bottom: 20px;
    }

    .hidden { display: none !important; }

    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .tab-btn.active {
      background: var(--accent-color);
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .input-group input, .input-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      margin-top: 8px;
    }

    .game-card-item {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .game-thumb {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .game-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: linear-gradient(to bottom, #0f172a, #020617);
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 15px;
    }

    .post-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .post-card img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>ERICADE STORE</h1>
    <p>Global Game Platform & Creator Hub</p>
  </header>

  <div class="container">

    <!-- Unique Single Login Card -->
    <div id="authCard" class="card">
      <h2 style="margin-bottom: 14px; color: var(--accent-color); font-size: 1.2rem;">User Login / Register</h2>
      <div class="input-group">
        <label>Username / Nickname</label>
        <input type="text" id="loginName" placeholder="Enter your name">
      </div>
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="Enter your email">
      </div>
      <button class="btn" onclick="handleLogin()">Login to Ericade Store</button>
    </div>

    <!-- Main Platform Interface -->
    <div id="platformCard" class="hidden">
      
      <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(30,41,59,0.7); padding: 10px 14px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1);">
        <div>
          <strong id="showUser" style="color: #34d399;">User</strong><br>
          <small id="showEmail" style="color: #94a3b8; font-size: 0.75rem;"></small>
        </div>
        <button onclick="handleLogout()" style="background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer;">Logout</button>
      </div>

      <div class="nav-tabs">
        <button class="tab-btn active" id="tabStore" onclick="switchTab('store')">Games Store</button>
        <button class="tab-btn" id="tabPublish" onclick="switchTab('publish')">Upload Game</button>
        <button class="tab-btn" id="tabCommunity" onclick="switchTab('community')">Community Wall</button>
      </div>

      <!-- 1. STORE & PLAY SECTION -->
      <div id="storeSection" class="card">
        <h3 style="color: var(--accent-color); margin-bottom: 12px;">Available Community Games</h3>
        <div id="storeList"></div>
      </div>

      <!-- 2. UPLOAD SECTION -->
      <div id="publishSection" class="card hidden">
        <h3 style="color: var(--accent-color); margin-bottom: 12px;">Upload & Publish Your Game</h3>
        <div class="input-group">
          <label>Game Title</label>
          <input type="text" id="pubTitle" placeholder="e.g. Cyber Runner 3D">
        </div>
        <div class="input-group">
          <label>Game Banner / Thumbnail Image</label>
          <input type="file" id="pubThumb" accept="image/*">
        </div>
        <div class="input-group">
          <label>Game APK / ZIP File</label>
          <input type="file" id="pubFile" accept=".apk,.zip,.html">
        </div>
        <div class="input-group">
          <label>Game Description</label>
          <textarea id="pubDesc" rows="2" placeholder="Brief info about your game..."></textarea>
        </div>
        <button class="btn" id="btnPublishStore" onclick="publishGame()">🚀 Publish Game Now</button>
      </div>

      <!-- 3. COMMUNITY SECTION -->
      <div id="communitySection" class="card hidden">
        <h3 style="color: var(--accent-color); margin-bottom: 12px;">Community Wall</h3>
        <div style="background: rgba(30,41,59,0.5); padding: 12px; border-radius: 12px; margin-bottom: 15px;">
          <h4 style="font-size: 0.9rem; margin-bottom: 8px; color: var(--cyan-glow);">Share a Photo or Moment</h4>
          <div class="input-group">
            <textarea id="postCaption" rows="2" placeholder="Write something..."></textarea>
          </div>
          <div class="input-group">
            <label style="font-size: 0.75rem;">Select Photo</label>
            <input type="file" id="postImage" accept="image/*">
          </div>
          <button class="btn" id="btnPostCommunity" style="margin-top: 4px;" onclick="createPost()">📤 Post to Wall</button>
        </div>
        <div id="postsFeed"></div>
      </div>

      <!-- 4. GAME PLAY ARENA -->
      <div id="arenaSection" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h3 id="playingTitle" style="color: var(--cyan-glow);">Playing Game</h3>
          <button class="btn" style="width: auto; margin:0; padding: 6px 12px; background: var(--danger-color);" onclick="exitGame()">Exit Game</button>
        </div>
        <div class="game-viewport">
          <span style="font-size: 3.5rem;">🎮</span>
          <h4 id="activeGameTitle" style="color: #34d399; margin-top: 10px;">Loading Session...</h4>
          <p id="activeGameDev" style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;"></p>
          <div style="margin-top: 15px;">
            <button class="btn" style="background: var(--gold-color); padding: 8px 16px;" onclick="alert('Simulation: Interactive game loop active!')">▶ Start Gameplay</button>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    let currentUser = null;

    window.onload = function() {
      let savedUser = localStorage.getItem('ericade_user');
      if(savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('showUser').innerText = currentUser.name;
        document.getElementById('showEmail').innerText = currentUser.email;
        document.getElementById('authCard').classList.add('hidden');
        document.getElementById('platformCard').classList.remove('hidden');
        renderStore();
      }
    };

    function handleLogin() {
      const name = document.getElementById('loginName').value.trim();
      const email = document.getElementById('loginEmail').value.trim();

      if(!name || !email) {
        alert("Please enter both your Name and Email address!");
        return;
      }

      currentUser = { name, email };
      localStorage.setItem('ericade_user', JSON.stringify(currentUser));

      document.getElementById('showUser').innerText = currentUser.name;
      document.getElementById('showEmail').innerText = currentUser.email;
      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('platformCard').classList.remove('hidden');
      renderStore();
    }

    function handleLogout() {
      localStorage.removeItem('ericade_user');
      currentUser = null;
      document.getElementById('authCard').classList.remove('hidden');
      document.getElementById('platformCard').classList.add('hidden');
    }

    function switchTab(tab) {
      document.getElementById('storeSection').classList.add('hidden');
      document.getElementById('publishSection').classList.add('hidden');
      document.getElementById('communitySection').classList.add('hidden');
      document.getElementById('arenaSection').classList.add('hidden');

      document.getElementById('tabStore').classList.remove('active');
      document.getElementById('tabPublish').classList.remove('active');
      document.getElementById('tabCommunity').classList.remove('active');

      if(tab === 'store') {
        document.getElementById('storeSection').classList.remove('hidden');
        document.getElementById('tabStore').classList.add('active');
        renderStore();
      } else if(tab === 'publish') {
        document.getElementById('publishSection').classList.remove('hidden');
        document.getElementById('tabPublish').classList.add('active');
      } else if(tab === 'community') {
        document.getElementById('communitySection').classList.remove('hidden');
        document.getElementById('tabCommunity').classList.add('active');
        renderPosts();
      }
    }

    function getStoreItems() {
      let items = localStorage.getItem('ericade_global_store');
      return items ? JSON.parse(items) : [
        { 
          title: "Open Survival 3D", 
          dev: "Ericade Official", 
          desc: "Official open-world multiplayer survival simulation.", 
          thumb: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=200", 
          data: "#" 
        }
      ];
    }

    function publishGame() {
      const title = document.getElementById('pubTitle').value.trim();
      const desc = document.getElementById('pubDesc').value.trim();
      const thumbInput = document.getElementById('pubThumb');
      const fileInput = document.getElementById('pubFile');
      const btn = document.getElementById('btnPublishStore');

      if(!title || fileInput.files.length === 0 || thumbInput.files.length === 0) {
        alert("Please enter title, thumbnail image, and game file!");
        return;
      }

      btn.innerText = "⏳ Uploading Assets...";
      btn.disabled = true;

      const thumbFile = thumbInput.files[0];
      const gameFile = fileInput.files[0];

      const readerThumb = new FileReader();
      readerThumb.onload = function(eThumb) {
        const thumbData = eThumb.target.result;

        const readerGame = new FileReader();
        readerGame.onload = function(eGame) {
          try {
            let store = getStoreItems();
            store.unshift({
              title,
              dev: currentUser.name,
              email: currentUser.email,
              desc: desc || "Community uploaded game.",
              thumb: thumbData,
              data: eGame.target.result,
              fileName: gameFile.name,
              date: new Date().toLocaleDateString()
            });
            localStorage.setItem('ericade_global_store', JSON.stringify(store));
            alert(`Success! "${title}" published to Ericade Store.`);
            
            document.getElementById('pubTitle').value = '';
            document.getElementById('pubDesc').value = '';
            thumbInput.value = '';
            fileInput.value = '';
            switchTab('store');
          } catch(err) {
            alert("File size is too large for storage!");
          } finally {
            btn.innerText = "🚀 Publish Game Now";
            btn.disabled = false;
          }
        };
        readerGame.readAsDataURL(gameFile);
      };
      readerThumb.readAsDataURL(thumbFile);
    }

    function renderStore() {
      const list = document.getElementById('storeList');
      const items = getStoreItems();
      
      list.innerHTML = '';
      items.forEach((item) => {
        list.innerHTML += `
          <div class="game-card-item">
            <img src="${item.thumb}" class="game-thumb" alt="Game Banner">
            <div style="flex: 1;">
              <strong style="color:var(--cyan-glow); font-size: 0.95rem;">${item.title}</strong><br>
              <small style="color:#94a3b8; font-size: 0.75rem;">By ${item.dev} • ${item.date || 'Recent'}</small>
              <p style="font-size: 0.8rem; color:#cbd5e1; margin: 4px 0 8px 0;">${item.desc}</p>
              <div style="display:flex; gap:6px;">
                <button class="btn" style="margin:0; padding:4px 10px; font-size:0.75rem;" onclick="playGame('${item.title}', '${item.dev}')">Play</button>
                <a class="btn" style="margin:0; padding:4px 10px; text-decoration:none; font-size:0.75rem; background:var(--gold-color);" href="${item.data}" download="${item.fileName || 'game.apk'}">Download</a>
              </div>
            </div>
          </div>
        `;
      });
    }

    function playGame(title, dev) {
      document.getElementById('storeSection').classList.add('hidden');
      document.getElementById('arenaSection').classList.remove('hidden');
      document.getElementById('activeGameTitle').innerText = title;
      document.getElementById('activeGameDev').innerText = "Developer: " + dev;
    }

    function exitGame() {
      document.getElementById('arenaSection').classList.add('hidden');
      document.getElementById('storeSection').classList.remove('hidden');
      renderStore();
    }

    function getPosts() {
      let posts = localStorage.getItem('ericade_global_posts');
      return posts ? JSON.parse(posts) : [];
    }

    function createPost() {
      const caption = document.getElementById('postCaption').value.trim();
      const imgInput = document.getElementById('postImage');
      const btn = document.getElementById('btnPostCommunity');

      if(imgInput.files.length === 0) {
        alert("Please select a photo to post!");
        return;
      }

      const file = imgInput.files[0];
      btn.innerText = "⏳ Posting...";
      btn.disabled = true;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          let posts = getPosts();
          posts.unshift({
            author: currentUser.name,
            email: currentUser.email,
            caption,
            image: e.target.result,
            date: new Date().toLocaleDateString()
          });
          localStorage.setItem('ericade_global_posts', JSON.stringify(posts));
          alert("Posted successfully to Community Wall!");
          document.getElementById('postCaption').value = '';
          imgInput.value = '';
          renderPosts();
        } catch(err) {
          alert("Image size too large!");
        } finally {
          btn.innerText = "📤 Post to Wall";
          btn.disabled = false;
        }
      };
      reader.readAsDataURL(file);
    }

    function renderPosts() {
      const feed = document.getElementById('postsFeed');
      const posts = getPosts();
      
      if(posts.length === 0) {
        feed.innerHTML = `<p style="text-align:center; color:#94a3b8; font-size:0.85rem;">No posts yet.</p>`;
        return;
      }

      feed.innerHTML = '';
      posts.forEach(p => {
        feed.innerHTML += `
          <div class="post-card">
            <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:4px;">
              <strong style="color:var(--accent-color);">${p.author}</strong>
              <span style="color:#94a3b8; font-size:0.75rem;">${p.date}</span>
            </div>
            <p style="font-size:0.9rem; margin-bottom:6px;">${p.caption || ''}</p>
            <img src="${p.image}" alt="Community Post">
          </div>
        `;
      });
    }
  </script>
</body>
</html>
